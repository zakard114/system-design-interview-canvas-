# 7/7 CI — unit/FE tests, Compose integration, container build on every push/PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Backend unit tests
        run: |
          uv sync --group dev
          uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test
        run: |
          npm ci
          npm test
          npm run build
        env:
          VITE_USE_MOCK: "false"

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Compose up
        run: docker compose up --build -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8100/health | grep -q ok; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Integration tests
        working-directory: backend
        run: |
          uv sync --group dev
          uv run pytest ../tests/integration -q
        env:
          E2E_BASE_URL: http://127.0.0.1:8100
      - name: Compose down
        if: always()
        run: docker compose down -v

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (Dockerfile)
        run: docker build -t interview-canvas:ci .
